name: Tanıtım seslendirmesi

# Elle çalıştırılır: tanitim dalındaki tanitim/metin.json metinlerini Türkçe sese çevirip aynı dala ekler.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "edge ya da gemini"
        default: "edge"
      voice:
        description: "Ses (edge: tr-TR-EmelNeural, gemini: Kore vb.)"
        default: "tr-TR-EmelNeural"
      model:
        description: "Gemini TTS modeli"
        default: "gemini-3.8-flash-tts"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tanitim
      - run: pip install --upgrade edge-tts
      - name: Sesleri üret
        env:
          VOICE: ${{ inputs.voice }}
          ENGINE: ${{ inputs.engine }}
          MODEL: ${{ inputs.model }}
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p tanitim/ses
          jq -c '.[]' tanitim/metin.json | while read -r row; do
            id=$(jq -r .id <<<"$row"); text=$(jq -r .text <<<"$row")
            if [ "$ENGINE" = edge ]; then
              edge-tts --voice "$VOICE" --rate=+4% --text "$text" --write-media "tanitim/ses/$id.mp3"
            else
              for try in 1 2 3 4 5; do
                jq -n --arg t "$text" --arg v "$VOICE" \
                  '{system_instruction:{parts:[{text:"You are a native Turkish voice actor. Speak ONLY the user text, in Turkish, word for word. Tone: natural, warm and relaxed, like casually recommending an app to a friend; normal conversational pace, no announcer voice, no exaggeration."}]},contents:[{parts:[{text:$t}]}],generationConfig:{response_modalities:["AUDIO"],speech_config:{voice_config:{prebuilt_voice_config:{voice_name:$v}}}}}' > b.json
                code=$(curl -sS -m 120 -o o.json -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent" -H "x-goog-api-key: $KEY" -H "Content-Type: application/json" --data @b.json || echo 000)
                echo "$id deneme $try: $code $(jq -r '.error.message // empty' o.json 2>/dev/null | cut -c1-150)"
                [ "$code" = 200 ] && break; sleep 8
              done
              mkdir -p "tanitim/ses-$VOICE"
              jq -r '.candidates[0].content.parts[0].inlineData.data' o.json | base64 -d > a.pcm
              python3 -c "import wave,sys;w=wave.open(sys.argv[1],'wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(24000);w.writeframes(open('a.pcm','rb').read());w.close()" "tanitim/ses-$VOICE/$id.wav"
              sleep 4
            fi
          done
          ls -la tanitim/ses
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tanitim && git commit -m "Seslendirme dosyaları" && git push
