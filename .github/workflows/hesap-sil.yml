name: Doğrulanmamış hesabı sil

# Elle çalıştırılır: verilen dakikada oluşturulmuş, e-postası doğrulanmamış ve hiç giriş yapmamış TEK hesabı siler.
# Dakika "Kayıt kontrolü" çıktısındaki "kayıt:" değeridir (UTC), örn. 2026-10-25T14:12
on:
  workflow_dispatch:
    inputs:
      created_minute:
        description: "Kayıt zamanı (UTC, YYYY-MM-DDTHH:MM)"
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MIN: ${{ inputs.created_minute }}
    steps:
      - name: Sil
        run: |
          KEY=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" -H "Authorization: Bearer $TOKEN" | jq -r '[.[] | select(.name=="service_role" or .type=="secret")][0].api_key')
          echo "::add-mask::$KEY"
          IDS=$(curl -sS "https://$REF.supabase.co/auth/v1/admin/users?per_page=1000" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            | jq -r --arg m "$MIN" '[.users[] | select(.created_at[0:16]==$m and .email_confirmed_at==null and .last_sign_in_at==null) | .id] | .[]')
          n=$(printf '%s\n' "$IDS" | grep -c . || true)
          if [ "$n" != 1 ]; then echo "Eşleşen hesap sayısı $n, hiçbir şey silinmedi"; exit 1; fi
          curl -sS -o /dev/null -w "silindi: HTTP %{http_code}\n" -X DELETE "https://$REF.supabase.co/auth/v1/admin/users/$IDS" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
