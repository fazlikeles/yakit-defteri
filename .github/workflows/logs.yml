name: Okuma servisi kayıtları

# Elle çalıştırılır: son 24 saatin okuma servisi (read-image) çağrılarını ve hata mesajlarını gösterir.
# Depo herkese açık olduğu için yalnızca zaman, durum kodu ve servis mesajları yazdırılır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Kayıtları getir
        run: |
          start=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() {
            curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
              -H "Authorization: Bearer $TOKEN" \
              --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
              | jq -r 'if .result then (.result | length | "(\(.) kayıt)"), (.result[] | "\(.timestamp/1000000 | floor | todate)  \(.event_message | gsub("https://[^ ]+"; "") | .[0:400])") else "Hata: \(.error // . | tostring | .[0:300])" end'
          }
          echo "== Çağrılar (zaman, yöntem, durum) =="
          q "select timestamp, event_message from function_edge_logs order by timestamp desc limit 40"
          echo; echo "== Servis mesajları =="
          q "select timestamp, event_message from function_logs order by timestamp desc limit 60"
